name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Public client identifiers only (RFC 8252 desktop client). Set once with:
      #   gh variable set GOOGLE_DESKTOP_CLIENT_ID --body "<id>.apps.googleusercontent.com"
      - name: Write public app config
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          $cfg = [ordered]@{}
          if ($env:GOOGLE_DESKTOP_CLIENT_ID) { $cfg.GoogleDesktopClientId = $env:GOOGLE_DESKTOP_CLIENT_ID }
          if ($env:GOOGLE_DESKTOP_CLIENT_SECRET) { $cfg.GoogleDesktopClientSecret = $env:GOOGLE_DESKTOP_CLIENT_SECRET }
          if ($cfg.Count -eq 0) { Write-Host "No Google client configured: build offers email sign-in only."; exit 0 }
          $cfg | ConvertTo-Json | Set-Content src/Unicaption.App/unicaption.config.json -Encoding utf8
          Write-Host "Google sign-in enabled for this build."

      - name: Test, publish and package
        shell: pwsh
        run: ./installer/build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UnicaptionSetup
          path: |
            installer/Output/UnicaptionSetup-*.exe
            installer/Output/latest.json
          if-no-files-found: error
