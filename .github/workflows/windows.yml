name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # unicaption.config.json is not in git. Google sign-in must ship with every release, so the
      # build fails without the Desktop OAuth client (repository variable or secret):
      #   gh variable set GOOGLE_DESKTOP_CLIENT_ID --body "<id>.apps.googleusercontent.com"
      #   gh secret set GOOGLE_DESKTOP_CLIENT_SECRET
      - name: Write app config
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID || secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_DESKTOP_CLIENT_ID) { throw 'Set GOOGLE_DESKTOP_CLIENT_ID (repository variable or secret)' }
          $cfg = [ordered]@{ GoogleDesktopClientId = $env:GOOGLE_DESKTOP_CLIENT_ID }
          if ($env:GOOGLE_DESKTOP_CLIENT_SECRET) { $cfg.GoogleDesktopClientSecret = $env:GOOGLE_DESKTOP_CLIENT_SECRET }
          $cfg | ConvertTo-Json | Set-Content src/Unicaption.App/unicaption.config.json -Encoding utf8

      - name: Test, publish and package
        shell: pwsh
        run: ./installer/build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UnicaptionSetup
          path: |
            installer/Output/UnicaptionSetup-*.exe
            installer/Output/latest.json
          if-no-files-found: error
