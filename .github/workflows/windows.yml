name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # unicaption.config.json is not in git; the installer needs the Google Desktop OAuth client.
      - name: Write client config
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_DESKTOP_CLIENT_ID) { throw 'Add the GOOGLE_DESKTOP_CLIENT_ID repository secret' }
          @{
            GoogleDesktopClientId = $env:GOOGLE_DESKTOP_CLIENT_ID
            GoogleDesktopClientSecret = $env:GOOGLE_DESKTOP_CLIENT_SECRET
          } | ConvertTo-Json | Set-Content src/Unicaption.App/unicaption.config.json -Encoding utf8

      - name: Test, publish and package
        shell: pwsh
        run: ./installer/build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UnicaptionSetup
          path: |
            installer/Output/UnicaptionSetup-*.exe
            installer/Output/latest.json
          if-no-files-found: error
